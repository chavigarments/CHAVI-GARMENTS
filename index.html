  <style>
/* ===== CSS Variables & Reset ===== */
:root {
  --primary: #8B1E3F;
  --primary-dark: #6B1530;
  --primary-light: #C44569;
  --accent: #D4A5A5;
  --gold: #C9A86C;
  --bg: #FFF9F7;
  --bg-dark: #2C1A1A;
  --text: #2C1A1A;
  --text-light: #6B5B5B;
  --white: #FFFFFF;
  --border: #F0E6E6;
  --shadow: 0 4px 20px rgba(139, 30, 63, 0.08);
  --shadow-lg: 0 10px 40px rgba(139, 30, 63, 0.12);
  --radius: 12px;
  --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  --font-display: 'Playfair Display', serif;
  --font-body: 'Poppins', sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html {
  scroll-behavior: smooth;
  scroll-padding-top: 140px; /* offset for sticky header when jumping to sections */
  height: auto;
  overflow-x: hidden;
  overflow-y: scroll;
  -webkit-overflow-scrolling: touch;
}
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  overflow-x: hidden;
  overflow-y: auto;
  min-height: 100%;
  position: relative;
  -webkit-overflow-scrolling: touch;
}
.container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
a { text-decoration: none; color: inherit; }
img { max-width: 100%; display: block; }
ul { list-style: none; }
button { cursor: pointer; border: none; font-family: inherit; }

/* ===== Edit Mode ===== */
.edit-banner {
  background: linear-gradient(90deg, #8B1E3F, #C44569);
  color: white;
  text-align: center;
  padding: 10px 20px;
  font-size: 0.9rem;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 15px;
  position: sticky;
  top: 0;
  z-index: 1001;
}
.edit-banner button {
  background: white;
  color: var(--primary);
  padding: 5px 15px;
  border-radius: 20px;
  font-weight: 600;
  font-size: 0.85rem;
}
.edit-banner.hidden { display: none; }
[contenteditable="true"] {
  outline: 2px dashed var(--primary-light);
  outline-offset: 2px;
  cursor: text;
  background: rgba(196, 69, 105, 0.05);
}
.product-img.editable, .category-img.editable {
  cursor: pointer;
  position: relative;
}
.product-img.editable::after, .category-img.editable::after {
  content: '📷 Tap image to replace';
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.45);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.3s;
  font-size: 0.85rem;
  font-weight: 500;
  pointer-events: none;
  z-index: 2;
}
.product-img.editable:hover::after, .category-img.editable:hover::after { opacity: 1; }

/* ===== Header ===== */
.header {
  background: var(--white);
  box-shadow: var(--shadow);
  position: sticky;
  top: 0;
  z-index: 1000;
}
.header-top {
  background: var(--bg-dark);
  color: var(--accent);
  font-size: 0.8rem;
  padding: 8px 0;
}
.header-top .container {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}
.header-top a { color: var(--accent); }
.header-top a:hover { color: white; }
.header-main { padding: 15px 0; }
.header-flex {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}
.logo h1 {
  font-family: var(--font-display);
  font-size: 1.8rem;
  font-weight: 700;
  letter-spacing: 1px;
  color: var(--primary);
}
.logo h1 span { color: var(--gold); }
.logo .tagline {
  font-size: 0.7rem;
  color: var(--text-light);
  letter-spacing: 2px;
  text-transform: uppercase;
}
.search-box {
  display: flex;
  flex: 1;
  max-width: 400px;
  border: 1.5px solid var(--border);
  border-radius: 50px;
  overflow: hidden;
  transition: var(--transition);
}
.search-box:focus-within {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(139, 30, 63, 0.1);
}
.search-box input {
  flex: 1;
  border: none;
  padding: 12px 20px;
  font-size: 0.95rem;
  outline: none;
  background: transparent;
}
.search-box button {
  background: var(--primary);
  color: white;
  padding: 0 20px;
  transition: var(--transition);
}
.search-box button:hover { background: var(--primary-dark); }
.header-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
.icon-btn {
  position: relative;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
  color: var(--text);
  transition: var(--transition);
}
.icon-btn:hover { background: var(--primary); color: white; }
.cart-count {
  position: absolute;
  top: -4px;
  right: -4px;
  background: var(--primary);
  color: white;
  font-size: 0.7rem;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
}
.whatsapp-btn {
  background: #25D366;
  color: white;
  padding: 10px 18px;
  border-radius: 50px;
  font-weight: 500;
  font-size: 0.9rem;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: var(--transition);
}
.whatsapp-btn:hover { background: #1DA851; transform: translateY(-1px); }
.nav { border-top: 1px solid var(--border); background: var(--white); }
.nav-list {
  display: flex;
  gap: 5px;
  overflow-x: auto;
  padding: 5px 0;
  scrollbar-width: none;
}
.nav-list::-webkit-scrollbar { display: none; }
.nav-link {
  padding: 10px 16px;
  font-size: 0.9rem;
  font-weight: 500;
  color: var(--text-light);
  border-radius: 8px;
  white-space: nowrap;
  transition: var(--transition);
}
.nav-link:hover, .nav-link.active {
  color: var(--primary);
  background: rgba(139, 30, 63, 0.08);
}

/* ===== Hero ===== */
.hero {
  position: relative;
  height: 70vh;
  min-height: 450px;
  background: linear-gradient(135deg, #2C1A1A 0%, #5C2A3A 40%, #8B1E3F 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 20% 80%, rgba(201, 168, 108, 0.15) 0%, transparent 40%),
    radial-gradient(circle at 80% 20%, rgba(196, 69, 105, 0.2) 0%, transparent 40%);
}
.hero-content {
  position: relative;
  text-align: center;
  color: white;
  z-index: 1;
  padding: 20px;
  max-width: 700px;
}
.hero-title {
  font-family: var(--font-display);
  font-size: clamp(2.2rem, 6vw, 3.8rem);
  font-weight: 700;
  line-height: 1.2;
  margin-bottom: 16px;
  letter-spacing: 1px;
}
.hero-sub {
  font-size: 1.1rem;
  opacity: 0.9;
  margin-bottom: 30px;
  font-weight: 300;
}
.hero-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 14px 28px;
  border-radius: 50px;
  font-weight: 500;
  font-size: 0.95rem;
  transition: var(--transition);
}
.btn-primary { background: var(--gold); color: var(--bg-dark); }
.btn-primary:hover {
  background: #B8944F;
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(201, 168, 108, 0.4);
}
.btn-outline {
  background: transparent;
  border: 2px solid rgba(255,255,255,0.6);
  color: white;
}
.btn-outline:hover {
  background: white;
  color: var(--primary);
  border-color: white;
}
.btn-block { width: 100%; justify-content: center; }
.hero-scroll {
  position: absolute;
  bottom: 25px;
  left: 50%;
  transform: translateX(-50%);
  color: rgba(255,255,255,0.6);
  font-size: 0.75rem;
  text-align: center;
  animation: bounce 2s infinite;
}
@keyframes bounce {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(8px); }
}

/* ===== Today's Offers ===== */
.offers-section {
  padding: 40px 0 20px;
  background: linear-gradient(180deg, #fff5f7 0%, var(--bg) 100%);
}
.offers-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.offers-header .section-title { margin-bottom: 0; text-align: left; }
.offers-header .section-title::after { margin: 8px 0 0; }
.offers-badge-live {
  background: var(--primary);
  color: white;
  font-size: 0.75rem;
  padding: 6px 12px;
  border-radius: 20px;
  font-weight: 600;
  animation: pulseOffer 1.5s ease infinite;
}
@keyframes pulseOffer {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.7; }
}
.offers-scroll {
  display: flex;
  gap: 16px;
  overflow-x: auto;
  padding: 8px 4px 16px;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
}
.offers-scroll::-webkit-scrollbar { height: 6px; }
.offers-scroll::-webkit-scrollbar-thumb { background: var(--primary-light); border-radius: 4px; }
.offer-card {
  flex: 0 0 200px;
  scroll-snap-align: start;
  background: white;
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: var(--transition);
  position: relative;
  border: 1px solid var(--border);
}
.offer-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }
.offer-card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
}
.offer-card-body { padding: 12px; }
.offer-card-body h4 {
  font-size: 0.9rem;
  margin-bottom: 6px;
  color: var(--text);
  line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.offer-price {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.offer-price .now { color: var(--primary); font-weight: 700; font-size: 1.05rem; }
.offer-price .was { color: var(--text-light); text-decoration: line-through; font-size: 0.85rem; }
.offer-discount {
  position: absolute;
  top: 10px;
  left: 10px;
  background: #e74c3c;
  color: white;
  font-size: 0.7rem;
  font-weight: 700;
  padding: 4px 8px;
  border-radius: 6px;
}
.offer-pin-btn {
  font-size: 0.72rem;
  padding: 6px 10px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: white;
  cursor: pointer;
  margin-top: 6px;
  width: 100%;
}
.offer-pin-btn.on {
  background: #fff3cd;
  border-color: #C9A86C;
  color: #8B1E3F;
  font-weight: 600;
}
.offers-empty {
  text-align: center;
  color: var(--text-light);
  padding: 24px;
  font-size: 0.9rem;
}

/* ===== Categories ===== */
.categories-section { padding: 60px 0 40px; }
.section-title {
  font-family: var(--font-display);
  font-size: 2rem;
  text-align: center;
  margin-bottom: 40px;
  color: var(--primary);
  position: relative;
}
.section-title::after {
  content: '';
  display: block;
  width: 60px;
  height: 3px;
  background: var(--gold);
  margin: 12px auto 0;
  border-radius: 2px;
}
.categories-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 20px;
}
.category-card {
  background: var(--white);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  transition: var(--transition);
  cursor: pointer;
  text-align: center;
}
.category-card:hover {
  transform: translateY(-6px);
  box-shadow: var(--shadow-lg);
}
.category-img {
  height: 140px;
  background: linear-gradient(135deg, #F5E6E8, #E8D0D5);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.5rem;
  color: var(--primary);
  position: relative;
  overflow: hidden;
}
.category-img img { width: 100%; height: 100%; object-fit: cover; }
.category-card h3 {
  padding: 14px 10px;
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--text);
}
.category-card span {
  display: block;
  font-size: 0.75rem;
  color: var(--text-light);
  padding-bottom: 12px;
}

/* ===== Catalogue ===== */
.catalogue { padding: 40px 0 80px; }
.catalogue-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 15px;
  margin-bottom: 30px;
}
.catalogue-header .section-title { margin-bottom: 0; text-align: left; }
.catalogue-header .section-title::after { margin: 12px 0 0; }
#sortSelect {
  padding: 10px 16px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-size: 0.9rem;
  background: white;
  outline: none;
  cursor: pointer;
}
#sortSelect:focus { border-color: var(--primary); }
.products-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 24px;
}
.product-card {
  background: var(--white);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  transition: var(--transition);
  display: flex;
  flex-direction: column;
}
.product-card:hover {
  transform: translateY(-5px);
  box-shadow: var(--shadow-lg);
}
.product-img {
  position: relative;
  height: 260px;
  background: linear-gradient(145deg, #F8EEF0, #F0DCE0);
  overflow: hidden;
}
.product-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.5s ease;
}
.product-card:hover .product-img img { transform: scale(1.05); }
.img-dots {
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 6px;
  z-index: 3;
}
.img-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: rgba(255,255,255,0.5);
  border: none;
  padding: 0;
  cursor: pointer;
  transition: var(--transition);
}
.img-dot.active { background: white; transform: scale(1.25); }
.img-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: rgba(255,255,255,0.85);
  color: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.9rem;
  z-index: 3;
  opacity: 0;
  transition: opacity 0.25s;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.product-img:hover .img-nav { opacity: 1; }
.img-nav.prev { left: 8px; }
.img-nav.next { right: 8px; }
.img-edit-bar {
  display: none;
  flex-direction: column;
  gap: 8px;
  padding: 10px;
  background: #fff8f9;
  border-top: 1px dashed var(--border);
}
.product-card.edit-on .img-edit-bar { display: flex; }
.img-drop-zone {
  border: 2px dashed var(--primary-light);
  border-radius: 12px;
  padding: 14px 10px;
  text-align: center;
  background: white;
  cursor: pointer;
  transition: var(--transition);
}
.img-drop-zone:hover, .img-drop-zone.dragover {
  border-color: var(--primary);
  background: rgba(139, 30, 63, 0.06);
}
.img-drop-zone strong {
  display: block;
  color: var(--primary);
  font-size: 0.9rem;
  margin-bottom: 4px;
}
.img-drop-zone span { font-size: 0.75rem; color: var(--text-light); }
.img-edit-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.img-edit-bar button, .img-edit-actions button {
  flex: 1 1 auto;
  min-width: 72px;
  font-size: 0.75rem;
  padding: 9px 8px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: white;
  color: var(--text);
  font-weight: 600;
  cursor: pointer;
}
.img-edit-bar .img-add-btn, .img-edit-actions .img-add-btn {
  background: var(--primary); color: white; border-color: var(--primary);
}
.img-edit-bar .img-camera-btn, .img-edit-actions .img-camera-btn {
  background: #2c3e50; color: white; border-color: #2c3e50;
}
.img-edit-bar .img-del-btn { background: #fee; color: #c0392b; border-color: #fcc; }
.img-edit-bar .img-adjust-btn { background: #C9A86C; color: #2C1A1A; border-color: #C9A86C; }
.img-edit-bar .img-fit-btn { background: #f5f5f5; }
.storage-pill {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,0.2);
  padding: 4px 10px; border-radius: 20px;
  font-size: 0.75rem; white-space: nowrap;
}
.product-img .img-add-btn,
.product-img .img-del-btn,
.product-img .img-fit-btn,
.product-img .img-adjust-btn { display: none !important; }
.img-count-badge {
  position: absolute;
  top: 12px;
  right: 12px;
  background: rgba(0,0,0,0.55);
  color: white;
  font-size: 0.7rem;
  padding: 3px 8px;
  border-radius: 12px;
  z-index: 3;
}
.product-img img.fit-contain { object-fit: contain; background: #f8eef0; }
.size-edit-wrap {
  margin-bottom: 8px;
  width: 100%;
}
.size-edit-wrap label {
  font-size: 0.72rem;
  color: var(--text-light);
  display: block;
  margin-bottom: 4px;
}
.size-edit-input {
  width: 100%;
  padding: 8px 10px;
  border: 1.5px dashed var(--primary-light);
  border-radius: 8px;
  font-size: 0.85rem;
  outline: none;
  background: rgba(196, 69, 105, 0.05);
}
.size-edit-input:focus { border-color: var(--primary); background: white; }
.size-quick-row {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 6px;
}
.size-quick-row button {
  font-size: 0.7rem;
  padding: 3px 8px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: white;
  color: var(--text);
}
.size-quick-row button:hover {
  border-color: var(--primary);
  color: var(--primary);
}
.img-lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  z-index: 9500;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.img-lightbox.show { display: flex; }
.img-lightbox img {
  max-width: 95%;
  max-height: 90vh;
  object-fit: contain;
  border-radius: 8px;
}
.img-lightbox-close {
  position: absolute;
  top: 16px;
  right: 20px;
  color: white;
  font-size: 2rem;
  background: none;
  border: none;
  cursor: pointer;
}
.img-lightbox-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(255,255,255,0.2);
  color: white;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: none;
  font-size: 1.2rem;
  cursor: pointer;
}
.img-lightbox-nav.prev { left: 16px; }
.img-lightbox-nav.next { right: 16px; }

/* Image zoom/pan adjuster */
.img-adjust-modal {
  position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9600;
  display: none; align-items: center; justify-content: center; padding: 16px;
}
.img-adjust-modal.show { display: flex; }
.img-adjust-box {
  background: #1a1a1a; border-radius: 16px; padding: 16px;
  width: 100%; max-width: 420px; color: white;
}
.img-adjust-box h3 {
  font-family: var(--font-display); font-size: 1.15rem;
  margin-bottom: 6px; text-align: center; color: #fff;
}
.img-adjust-hint { font-size: 0.78rem; color: #aaa; text-align: center; margin-bottom: 12px; }
.img-adjust-viewport {
  width: 100%; aspect-ratio: 4 / 5; background: #111; border-radius: 12px;
  overflow: hidden; position: relative; touch-action: none; cursor: grab;
  border: 2px solid rgba(255,255,255,0.15);
}
.img-adjust-viewport:active { cursor: grabbing; }
.img-adjust-viewport img {
  position: absolute; top: 50%; left: 50%; transform-origin: center center;
  max-width: none; user-select: none; pointer-events: none; -webkit-user-drag: none;
}
.img-adjust-controls {
  display: flex; align-items: center; gap: 10px; margin-top: 14px;
  justify-content: center; flex-wrap: wrap;
}
.img-adjust-controls button {
  width: 40px; height: 40px; border-radius: 50%; border: none;
  background: rgba(255,255,255,0.15); color: white; font-size: 1.2rem; cursor: pointer;
}
.img-adjust-controls button:hover { background: var(--primary); }
.img-adjust-controls input[type="range"] {
  flex: 1; min-width: 120px; accent-color: var(--primary-light);
}
.img-adjust-actions { display: flex; gap: 10px; margin-top: 14px; }
.img-adjust-actions button {
  flex: 1; padding: 12px; border-radius: 10px; border: none;
  font-weight: 600; font-size: 0.95rem; cursor: pointer;
}
